name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual trigger for re-running failed releases (requires existing tag)

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Validate required GitHub App variables
        env:
          STACKTOWER_GITHUB_APP_CLIENT_ID: ${{ vars.STACKTOWER_GITHUB_APP_CLIENT_ID }}
          STACKTOWER_GITHUB_APP_SLUG: ${{ vars.STACKTOWER_GITHUB_APP_SLUG }}
        run: |
          test -n "${STACKTOWER_GITHUB_APP_CLIENT_ID}" || (echo "Missing required org/repo variable: STACKTOWER_GITHUB_APP_CLIENT_ID" && exit 1)
          test -n "${STACKTOWER_GITHUB_APP_SLUG}" || (echo "Missing required org/repo variable: STACKTOWER_GITHUB_APP_SLUG" && exit 1)

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          STACKTOWER_GITHUB_APP_CLIENT_ID: ${{ vars.STACKTOWER_GITHUB_APP_CLIENT_ID }}
          STACKTOWER_GITHUB_APP_SLUG: ${{ vars.STACKTOWER_GITHUB_APP_SLUG }}
