name: Dependency Diff

on:
  pull_request:
    paths:
      - "**/go.mod"
      - "**/go.sum"

permissions:
  contents: read
  pull-requests: write

jobs:
  tower-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run Stacktower dependency diff
        uses: stacktower-io/stacktower-action@v2
        with:
          api-key: ${{ secrets.STACKTOWER_API_KEY }}
